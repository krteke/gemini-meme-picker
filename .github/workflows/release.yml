name: Release Chrome & Firefox Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 1.0.1; defaults to package.json version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify AMO signing secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            INPUT_VER="${{ github.event.inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              VERSION="${INPUT_VER#v}"
            else
              VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
            fi
            TAG="v${VERSION}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Resolved VERSION is empty."
            exit 1
          fi
          echo "Resolved release version=${VERSION}, tag=${TAG}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          VERSION="$VERSION" node -e "const fs=require('fs');const v=process.env.VERSION;if(!v)throw new Error('VERSION is empty');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Build & zip Chrome, build Firefox, test, and lint
        run: |
          pnpm zip
          pnpm build:firefox
          pnpm test
          pnpm lint:firefox
          VERSION="$VERSION" node -e "const fs=require('fs');for(const f of ['.output/chrome-mv3/manifest.json','.output/firefox-mv2/manifest.json']){const m=JSON.parse(fs.readFileSync(f,'utf8'));if(m.version!==process.env.VERSION)throw new Error(f+' version mismatch: '+m.version+' !== '+process.env.VERSION);}"

      - name: Sign Firefox extension & stage release assets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          rm -rf .output/web-ext-artifacts .output/release
          mkdir -p .output/web-ext-artifacts .output/release

          CHROME_ZIP=".output/gemini-meme-picker-${VERSION}-chrome.zip"
          if [ ! -f "$CHROME_ZIP" ]; then
            ls -la .output
            echo "::error::Expected Chrome zip not found: $CHROME_ZIP"
            exit 1
          fi
          cp "$CHROME_ZIP" ".output/release/gemini-meme-picker-${VERSION}-chrome.zip"

          pnpm exec web-ext sign \
            --source-dir=.output/firefox-mv2 \
            --artifacts-dir=.output/web-ext-artifacts \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --approval-timeout=900000

          SIGNED_XPI="$(find .output/web-ext-artifacts -maxdepth 1 -name '*.xpi' | head -n 1)"
          if [ -z "$SIGNED_XPI" ]; then
            echo "::error::web-ext sign did not produce an .xpi file."
            exit 1
          fi

          cp "$SIGNED_XPI" ".output/release/gemini-meme-picker-${VERSION}-firefox.xpi"

      - name: Generate Firefox updates.json
        run: |
          if git show origin/main:updates.json >/tmp/base-updates.json 2>/dev/null; then
            cp /tmp/base-updates.json updates.json
          fi
          node scripts/generate-updates-json.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --xpi ".output/release/gemini-meme-picker-${VERSION}-firefox.xpi" \
            --repo "${{ github.repository }}" \
            --output updates.json
          cp updates.json .output/release/updates.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          files: |
            .output/release/gemini-meme-picker-${{ env.VERSION }}-firefox.xpi
            .output/release/gemini-meme-picker-${{ env.VERSION }}-chrome.zip
            .output/release/updates.json

      - name: Commit and push updates.json to main
        run: |
          cp updates.json /tmp/updates.json
          git checkout -- package.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/updates.json updates.json
          if ! git diff --quiet updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates.json
            git commit -m "chore(release): update Firefox updates.json for ${TAG} [skip ci]"
            git push origin main
          fi
